# agentd example config. Copy to config.toml and edit.
# config.toml (with real secrets) is gitignored; only this example is committed.

[server]
bind       = "127.0.0.1:8787"   # local-only by default (design 3.9)
# public_bind = "100.64.0.1:8787"   # optional 2nd listener: PUBLIC routes only (/watch/), e.g. a tailnet address
api_bearer = "change-me-bearer"  # gates the local HTTP/WS API
state_dir  = "state"             # run-log + durable state live here

# Workspaces: every session is homed in a workspace (the agent's persistent
# home dir: instructions/ + memory/ wiki + context.md handoff + work/), kept
# under git. See internal/workspace and the README's Workspace section.
[workspace]
root    = ""                     # dir holding workspaces; empty = ~/.agentd/workspaces
default = ""                     # workspace when a session names none; empty = "default"
git_autocommit = true            # commit workspace changes after each completed turn

# Session lifecycle + context reset. agentd keeps ONE warm session per workspace
# and never compacts; instead it owns a controlled RESET (checkpoint-flush ->
# teardown -> fresh process re-hydrated from the workspace artifacts). These are
# the config-tunable triggers and backstops; omit the block to accept defaults.
[session]
# Reset when the live context PRESSURE (0..1 of the window) crosses this after a
# completed turn. Pressure is REAL for Claude Code (measured token usage) and a
# turns/bytes/wallclock PROXY for harnesses without usage.
context_reset_pressure = 0.75
# A session idle this long is checkpoint-flushed and its process reclaimed (GC).
idle_timeout       = "30m"
# Hard backstops that force a reset regardless of the pressure signal (protects
# proxy-only harnesses and runaway sessions). 0 disables a backstop.
max_turns          = 200
max_wallclock      = "8h"
# Model context window (tokens) used as the denominator for REAL pressure. A
# known model id overrides this per session.
context_window     = 200000
# How often the sweeper enforces idle_timeout and reclaims dead/stale sessions.
gc_interval        = "1m"
# Upper bound on the checkpoint-flush turn; if it overruns, agentd tears down and
# starts fresh anyway (a wedged flush never strands the session).
checkpoint_timeout = "120s"
# QUIET WINDOW on ONE inbound turn (a Telegram/web message routed to the agent).
# This is NOT a cap on how long a turn may take. It is how long the turn may go
# with NO sign of progress: every tool call, streamed output line and result
# RESETS it, so work that is genuinely happening is never killed for taking a
# while. It fires only when the session has gone silent, which is the case where
# the turn really is stuck. On expiry agentd ABANDONS the reply (an answer the
# harness produces afterwards has nowhere to go) and the user gets a failure
# notice that says the turn went silent, plus whatever partial output it had.
turn_timeout       = "15m"
# ABSOLUTE backstop on one turn, so an inactivity bound cannot make a runaway
# unkillable: a loop that keeps emitting tool calls forever would otherwise keep
# resetting turn_timeout forever. Sits far above any real turn and below
# max_wallclock. A negative value turns the backstop off (not recommended).
turn_ceiling       = "2h"
# Replies are read on an Apple Watch, where only the LAST message shows at the
# bottom of the chat and a notification previews roughly this many characters.
# Above the budget the agent is asked, PER TURN, to write the full answer, then
# a ---SUMMARY--- line, then a short summary; agentd then delivers the full
# answer first and SILENTLY and the summary after it, so the summary is what
# lands last and is the only push. 0 turns this off (one verbatim reply).
summary_budget     = 200

# Media: the CORE multimodal capability (internal/media), channel-agnostic by
# design. Inbound voice / photos / documents from ANY channel are ingested here
# (storage under <default workspace>/work/media/<source>/, gitignored in the
# workspace repo), classified, size-capped, and audio is transcribed via the
# OpenAI Whisper API during ingest (the transcript is the artifact; the audio
# file is deleted on success, kept on failure). The SESSION layer renders
# artifact markers into the turn text; channels only acquire bytes. A retention
# sweeper deletes stored media after `retention`. Omit the block for defaults.
[media]
enabled       = true
# OpenAI API key for Whisper: literal or "env:VAR" (same indirection as channel
# tokens). Empty = voice stays wired but disabled (senders get a polite reply).
whisper_key   = "env:OPENAI_API_KEY"
whisper_model = "whisper-1"
whisper_lang  = ""               # ISO-639-1 hint (e.g. "de"); empty = auto-detect
max_file_mb   = 20               # per-file cap (Telegram's Bot API caps downloads at 20 MB anyway)
retention     = "168h"           # media older than this is swept (transcripts live in the session, not here)
# media_dir   = ""               # storage override; empty = <default workspace>/work/media

# Select exactly one backend: "claude-code" or "codex".
# Codex uses the installed CLI login; run `codex login` as the daemon user.
[[harness]]
kind  = "claude-code"
# bin = "/absolute/path/to/claude" # optional; defaults to the backend command on PATH
model = ""                       # optional model override; empty = harness default
cwd   = ""                       # optional default working dir for sessions
# skip_permissions=true passes --dangerously-skip-permissions: claude runs tools
# WITHOUT asking for approval (hands-free autonomous agent, Joe's default). This
# DISABLES Claude's own permission guardrail; agentd's confirm-gate is the
# intended safety layer for visible/destructive actions. Set false to keep
# Claude's prompts. Codex: true bypasses approvals and sandbox; false runs
# read-only with approvals disabled (exec cannot answer interactive prompts).
skip_permissions = true
# prompt_dir (claude-code only): write the composed system prompt to a 0600 file
# in this directory and pass --append-system-prompt-file. Without it the prompt
# is in argv, which every local user can read through /proc. Use an absolute path.
# prompt_dir = "/home/me/.agentd/state/prompts"

# One channel entry. Token is read from the environment (never inlined).
[[channel]]
kind    = "telegram"
enabled = true                   # default true; set false to park the channel
token   = "env:TG_BOT_TOKEN"     # export TG_BOT_TOKEN before starting
allow   = ["123456789"]         # chat-id allowlist, server-enforced
# Emoji progress feedback on YOUR OWN message, so a turn is legible at a glance:
#   👀 received (server has it)  ->  ⚡ working (a session picked it up)
#   ->  👍 done (reply sent)  |  😱 error (turn failed/timed out)  |  🤔 waiting on you
# Each call REPLACES the previous glyph (Bot API setMessageReaction). Telegram
# only accepts its own fixed reaction whitelist (✅ and ⚠️ are rejected), so the
# glyphs above are all whitelisted ones; a rejected emoji is logged and ignored,
# never fatal to the turn. Default true; set false for no reactions at all.
reactions = true

# The WEB channel: a self-contained local UI served by the SAME server (no 2nd
# port) at /ui, and the reference ChannelAdapter the future wrist/phone app is a
# client of. It shows the session list (status + context pressure), a live event
# stream + input box for the active session, a notifications feed (scheduler job
# notifications surface HERE via the notify hub). It is a
# notify sink too. AUTH: it reuses the api_bearer. In a browser, open
# http://127.0.0.1:8787/ui?token=<api_bearer> ONCE; that sets a same-origin
# httponly cookie which then authenticates the page, its JSON calls, and the WS.
# Default enabled; bound to 127.0.0.1 (reachable over Tailscale like the API).
[[channel]]
kind    = "web"
enabled = true
title   = "agentd"               # shown in the UI header/title

# Watch (wrist) channel: the async inbox/outbox behind the Apple Watch app.
# POST /watch/messages (JSON text or a multipart voice file, transcribed on the
# spot so the receipt already carries the transcript), GET /watch/messages
# (long-poll fetch), GET /watch/ping. Gated by its OWN token (never the API
# bearer) and mounted as a PUBLIC route, so a public HTTPS proxy (Caddy on a
# VPS, forwarding over Tailscale to [server] public_bind) can reach it while
# the code-executing API stays on loopback.
#   share_session = true  the wrist drives the Telegram chat's session
#                         (one brain, two surfaces; needs a telegram channel)
#   mirror        = true  every wrist transcript and reply is echoed into the
#                         Telegram chat (phone keeps the record + push)
# Conversation store: <state_dir>/watch-messages.jsonl.
[[channel]]
kind          = "watch"
enabled       = false
token         = "env:AGENTD_WATCH_TOKEN"
title         = "agentd"
share_session = true
mirror        = true

# ------------------------------------------------------------------------------
# Jobs (internal/scheduler): declarative proactive work. A job = a TRIGGER + a
# target WORKSPACE + a task PROMPT. A job run is an ordinary harness turn on the
# workspace's warm session (create-or-reuse), so the harness does the work with
# its own shell/file tools against the workspace and the normal lifecycle
# (git autocommit, context reset, idle reclaim) applies. Runs serialize behind
# any in-progress interactive turn in the same workspace; v1 additionally runs
# at most ONE job turn at a time overall.
#
# Jobs use the "schedule" trigger (default). Inbound messages
# are already a trigger via the channel path and are NOT configured as jobs.
# Schedule specs: "@every 30m" | "@daily 07:00" | basic cron "M H DOM MON DOW".
# tz is an IANA name for @daily/cron; default is the server's local timezone.
# notify: "issues" (default, surface only non-ok runs) | "always" | "never".
# Catch-up policy: occurrences missed while the server was down/asleep are
# SKIPPED with a logged job_skip record (no fire-on-startup).
# ------------------------------------------------------------------------------

[[job]]
name      = "morning-triage"
trigger   = "schedule"
schedule  = "@daily 07:00"
tz        = "Europe/Zurich"
workspace = ""                   # empty = the default workspace
prompt    = "Morning triage: read context.md, check work/ for anything pending, update context.md with today's priorities. Note issues that need my attention concisely."
notify    = "issues"             # surface only when something is wrong

[[job]]
name      = "hourly-heartbeat"
schedule  = "@every 1h"          # trigger defaults to "schedule"
prompt    = "Append the current date and time as one line to work/heartbeat.log, then note in context.md when the last heartbeat ran."
notify    = "never"
enabled   = false                # parked; fire manually with `agentd jobs run hourly-heartbeat`
