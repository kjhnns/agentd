<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>agentd</title>
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --panel-2:#fbfcfd; --ink:#1a1d21; --muted:#697586;
    --faint:#9aa4b2; --line:#e6e9ee; --line-soft:#eef1f5;
    --accent:#3b6ef5; --accent-ink:#fff; --accent-soft:#eaf0ff;
    --ok:#118a53; --warn:#b06f16; --err:#d1453b;
    --chip:#eef1f6; --code:#f1f3f6; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);
    --radius:12px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1014; --panel:#151a20; --panel-2:#11151b; --ink:#e7eaef; --muted:#9aa6b4;
      --faint:#6b7787; --line:#242b34; --line-soft:#1c222a;
      --accent:#6a93ff; --accent-ink:#0b0e12; --accent-soft:#1a2438;
      --ok:#42cf83; --warn:#e6a53a; --err:#ff6b60;
      --chip:#1e242d; --code:#1a1f27; --shadow:0 1px 2px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="light"]{
    --bg:#f4f5f7; --panel:#ffffff; --panel-2:#fbfcfd; --ink:#1a1d21; --muted:#697586;
    --faint:#9aa4b2; --line:#e6e9ee; --line-soft:#eef1f5;
    --accent:#3b6ef5; --accent-ink:#fff; --accent-soft:#eaf0ff;
    --chip:#eef1f6; --code:#f1f3f6; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);
  }
  :root[data-theme="dark"]{
    --bg:#0d1014; --panel:#151a20; --panel-2:#11151b; --ink:#e7eaef; --muted:#9aa6b4;
    --faint:#6b7787; --line:#242b34; --line-soft:#1c222a;
    --accent:#6a93ff; --accent-ink:#0b0e12; --accent-soft:#1a2438;
    --chip:#1e242d; --code:#1a1f27; --shadow:0 1px 2px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink);overflow-x:hidden;
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  header{
    display:flex;align-items:center;gap:.55rem;padding:.65rem 1rem;
    border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5;
  }
  header .dot{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none;
    box-shadow:0 0 0 3px transparent;transition:box-shadow .2s}
  header .dot.up{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
  header .dot.down{background:var(--err);box-shadow:0 0 0 3px color-mix(in srgb,var(--err) 22%,transparent)}
  header h1{font-size:15px;margin:0;font-weight:660;letter-spacing:-.01em}
  header .sp{flex:1}
  button{
    font:inherit;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink);
    padding:.36rem .68rem;border-radius:9px;cursor:pointer;transition:background .12s,border-color .12s
  }
  button:hover{background:var(--chip)}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  button.primary:hover{filter:brightness(1.06)}
  button:active{transform:translateY(1px)}
  .wrap{display:grid;grid-template-columns:288px minmax(0,1fr) 300px;gap:0;height:calc(100% - 52px)}
  .col{min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .col.sessions{border-right:1px solid var(--line);background:var(--panel-2)}
  .col.notifs{border-left:1px solid var(--line);background:var(--panel-2)}
  .col h2{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);
    font-weight:600;margin:0;padding:.85rem .95rem .45rem}
  .scroll{overflow-y:auto;overflow-x:hidden;flex:1;padding:0 .55rem .7rem}
  .sess{padding:.6rem .65rem;border-radius:var(--radius);cursor:pointer;margin:.18rem .1rem;
    border:1px solid transparent;transition:background .12s,border-color .12s}
  .sess:hover{background:var(--panel)}
  @media (prefers-color-scheme: light){ .sess:hover{box-shadow:var(--shadow)} }
  .sess.active{background:var(--panel);border-color:var(--accent);box-shadow:var(--shadow)}
  .sess.active .t{color:var(--accent)}
  .trow{display:flex;align-items:baseline;gap:.5rem}
  .trow.foot{margin-top:.4rem;align-items:center;gap:.4rem}
  .sess .t{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .sess .when{font-size:11px;color:var(--faint);flex:none;white-space:nowrap}
  .sess .m{font-size:11.5px;color:var(--muted);display:flex;gap:.5rem;align-items:center;margin-top:.28rem;flex-wrap:wrap}
  .sess.past{background:transparent}
  .sess.past .t{font-weight:560}
  .sess .pv{font-size:12px;color:var(--muted);margin-top:.32rem;line-height:1.4;
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .sess.sub{margin-left:.7rem;padding:.4rem .55rem;border-left:2px solid var(--line);border-radius:0 8px 8px 0}
  .sess.sub .t{font-weight:500;font-size:12.5px;color:var(--muted)}
  .cbtn{font-size:11px;padding:.14rem .5rem;border-radius:7px;margin-left:auto;color:var(--muted)}
  .cbtn:hover{color:var(--ink)}
  .badge{font-size:11px;padding:.12rem .5rem;border-radius:999px;background:var(--chip);
    border:1px solid var(--line-soft);color:var(--muted);cursor:pointer}
  .badge:hover{background:var(--chip);color:var(--ink)}
  .badge.ghost{cursor:default;background:transparent;border-color:transparent;color:var(--faint);padding-left:0}
  h2.pasthead{padding-top:.9rem}
  .pill{font-size:10.5px;font-weight:600;padding:.08rem .48rem;border-radius:999px;
    background:var(--chip);border:1px solid var(--line-soft);text-transform:capitalize;letter-spacing:.01em}
  .pill.idle{color:var(--muted)}
  .pill.thinking{color:var(--accent);background:var(--accent-soft);border-color:transparent}
  .pill.error{color:var(--err)}
  .bar{height:4px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:.45rem}
  .bar>i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
  .conv{flex:1;overflow-y:auto;overflow-x:hidden;padding:1.2rem;display:flex;flex-direction:column;
    gap:.6rem;max-width:900px;width:100%;margin:0 auto}
  .ev{max-width:80ch;padding:.55rem .75rem;border-radius:14px;border:1px solid var(--line);
    background:var(--panel);box-shadow:var(--shadow)}
  .ev.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-color:transparent;border-bottom-right-radius:5px}
  .ev:not(.me){border-bottom-left-radius:5px}
  .ev.result{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
  .ev.error{border-color:var(--err)}
  .ev .k{font-size:10px;text-transform:uppercase;letter-spacing:.06em;opacity:.6;margin-bottom:.2rem;font-weight:600}
  .ev .tool{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--code);
    padding:.1rem .3rem;border-radius:5px}
  .ev pre{margin:0;white-space:pre-wrap;word-break:break-word;font:inherit}
  .ev .md{word-break:break-word}
  .ev .md p{margin:0 0 .35rem}
  .ev .md p:last-child,.ev .md ul:last-child,.ev .md ol:last-child,.ev .md pre:last-child{margin-bottom:0}
  .ev .md ul,.ev .md ol{margin:0 0 .35rem;padding-left:1.25rem}
  .ev .md li{margin:.1rem 0}
  .ev .md code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
    background:var(--code);padding:.08rem .3rem;border-radius:5px}
  .ev .md pre{margin:0 0 .35rem;padding:.5rem .6rem;background:var(--code);border-radius:8px;
    overflow-x:auto;white-space:pre;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
  .ev .md pre code{background:none;padding:0}
  .ev .md h1,.ev .md h2,.ev .md h3,.ev .md h4,.ev .md h5,.ev .md h6{margin:.4rem 0 .25rem;font-size:14px;font-weight:650}
  .ev .md h1{font-size:15.5px} .ev .md h2{font-size:14.5px}
  .ev .md a{color:var(--accent)}
  .ev.me .md a{color:inherit}
  .ev .md strong{font-weight:650}
  .confirm{align-self:center;display:flex;gap:.5rem;align-items:center;background:var(--panel);
    border:1px dashed var(--warn);padding:.5rem .7rem;border-radius:12px}
  .composer{display:flex;gap:.5rem;padding:.7rem;border-top:1px solid var(--line);background:var(--panel);
    max-width:900px;width:100%;margin:0 auto}
  .composer textarea{flex:1;resize:none;height:2.6rem;max-height:9rem;padding:.55rem .7rem;border-radius:11px;
    border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
  .composer textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .notif{padding:.55rem .6rem;border-radius:11px;margin:.22rem .1rem;border:1px solid var(--line);
    background:var(--panel);box-shadow:var(--shadow)}
  .notif.issue{border-color:var(--err)} .notif.result{border-color:var(--ok)}
  .notif .s{font-size:11px;color:var(--faint);display:flex;justify-content:space-between}
  .notif .x{margin-top:.25rem;font-size:13px;line-height:1.45}
  .empty{color:var(--faint);font-size:13px;padding:1.4rem 1rem;text-align:center;line-height:1.5}
  .login{max-width:340px;margin:14vh auto;background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:1.5rem;box-shadow:var(--shadow)}
  .login h1{font-size:17px;margin:0 0 .3rem} .login p{color:var(--muted);font-size:13px;margin:.2rem 0 1rem}
  .login input{width:100%;padding:.55rem .6rem;border-radius:9px;border:1px solid var(--line);
    background:var(--bg);color:var(--ink);font:inherit;margin-bottom:.7rem}
  @media (max-width:860px){
    header{gap:.35rem;padding:.55rem .6rem;flex-wrap:nowrap}
    header h1{font-size:14px}
    header button{padding:.3rem .5rem;font-size:12.5px;white-space:nowrap}
    .wrap{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);height:calc(100% - 50px)}
    .col.sessions{max-height:40vh;border-right:none;border-bottom:1px solid var(--line);background:var(--panel-2)}
    .col.conv-col{min-height:0}
    .conv{padding:.9rem}
    .ev{max-width:100%}
    .col.notifs{position:fixed;inset:auto 0 0 0;max-height:60vh;border-left:none;border-top:1px solid var(--line);
      transform:translateY(100%);transition:transform .2s ease;z-index:8;box-shadow:0 -6px 24px rgba(0,0,0,.14)}
    .col.notifs.open{transform:none}
    .notiftoggle{display:inline-flex}
  }
  @media (min-width:861px){ .notiftoggle{display:none} }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
(function(){
  const $ = (s,el=document)=>el.querySelector(s);
  const h = (tag,attrs={},...kids)=>{
    const e=document.createElement(tag);
    for(const k in attrs){ if(k==="class")e.className=attrs[k]; else if(k.startsWith("on"))e[k]=attrs[k]; else e.setAttribute(k,attrs[k]); }
    for(const c of kids){ if(c==null)continue; e.append(c.nodeType?c:document.createTextNode(c)); }
    return e;
  };
  const esc = s => (s==null?"":String(s));

  // --- markdown renderer (mdRender) ---
  // Renders the COMMON markdown subset the agent emits (bold, italic, inline
  // code, fenced code blocks, headings, ordered/unordered lists, http(s)
  // links, paragraphs/line breaks) into an HTML string. XSS-safe BY
  // CONSTRUCTION: the raw model text is HTML-escaped FIRST (mdEscapeHtml) and
  // every transform below operates on that escaped text, so model-supplied
  // <script>/<img>/attribute text can never reach the DOM as markup; the only
  // markup in the output is what these functions themselves emit. Links are
  // generated for http/https URLs only. No tables/images on purpose. Kept as
  // pure functions between these markers so a Go test can extract and
  // golden-test them under node (see web_test.go).
  function mdEscapeHtml(s){
    return String(s==null?"":s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function mdInline(s){
    // Protect code spans first so their contents skip bold/italic/link rules.
    const codes=[];
    s = s.replace(/`([^`]+)`/g, function(_,c){ codes.push(c); return "\u0000"+(codes.length-1)+"\u0000"; });
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
    s = s.replace(/(^|[\s(])\*([^*\s](?:[^*]*[^*\s])?)\*/g,"$1<em>$2</em>");
    s = s.replace(/(^|[\s(])_([^_\s](?:[^_]*[^_\s])?)_/g,"$1<em>$2</em>");
    s = s.replace(/\u0000(\d+)\u0000/g, function(_,i){ return "<code>"+codes[+i]+"</code>"; });
    return s;
  }
  function mdRender(src){
    const lines = mdEscapeHtml(src).split(/\r?\n/);
    const out=[]; const para=[];
    const flush=function(){ if(para.length){ out.push("<p>"+para.map(mdInline).join("<br>")+"</p>"); para.length=0; } };
    for(let i=0;i<lines.length;i++){
      const l=lines[i]; let m;
      if(/^```/.test(l)){ // fenced code block: verbatim (already escaped)
        flush(); const code=[]; i++;
        while(i<lines.length && !/^```/.test(lines[i])){ code.push(lines[i]); i++; }
        out.push("<pre><code>"+code.join("\n")+"</code></pre>");
        continue;
      }
      if((m=/^(#{1,6})\s+(.+)$/.exec(l))){
        flush(); const n=m[1].length;
        out.push("<h"+n+">"+mdInline(m[2])+"</h"+n+">");
        continue;
      }
      if(/^\s*[-*+]\s+/.test(l)){
        flush(); const items=[];
        while(i<lines.length && (m=/^\s*[-*+]\s+(.*)$/.exec(lines[i]))){ items.push("<li>"+mdInline(m[1])+"</li>"); i++; }
        i--; out.push("<ul>"+items.join("")+"</ul>");
        continue;
      }
      if(/^\s*\d+[.)]\s+/.test(l)){
        flush(); const items=[];
        while(i<lines.length && (m=/^\s*\d+[.)]\s+(.*)$/.exec(lines[i]))){ items.push("<li>"+mdInline(m[1])+"</li>"); i++; }
        i--; out.push("<ol>"+items.join("")+"</ol>");
        continue;
      }
      if(/^\s*$/.test(l)){ flush(); continue; }
      para.push(l);
    }
    flush();
    return out.join("");
  }
  // --- end markdown renderer ---

  // ---- auth: token comes in ?token= on first load; server set an httponly
  // cookie from it, so subsequent fetch/WS are authenticated by the cookie.
  // We strip it from the URL for cleanliness. A 401 shows the login field.
  const url = new URL(location.href);
  const urlToken = url.searchParams.get("token");
  if(urlToken){ url.searchParams.delete("token"); history.replaceState({}, "", url.toString()); }

  const state = { sessions:[], past:[], pastIds:{}, active:null, transportOK:false, notifs:[], ws:null, expanded:new Set() };

  async function api(path, opts={}){
    const r = await fetch(path, Object.assign({credentials:"same-origin",headers:{"Content-Type":"application/json"}}, opts));
    if(r.status===401){ throw {unauth:true}; }
    return r;
  }

  function renderLogin(){
    $("#app").replaceChildren(h("div",{class:"login"},
      h("h1",{},"agentd"),
      h("p",{},"Paste the API bearer to connect. It is stored as a same-origin httponly cookie."),
      h("input",{id:"tok",type:"password",placeholder:"bearer token",onkeydown:e=>{if(e.key==="Enter")go();}}),
      h("button",{class:"primary",onclick:go},"Connect")
    ));
    function go(){ const t=$("#tok").value.trim(); if(t) location.href = "/ui?token="+encodeURIComponent(t); }
  }

  function fmtPct(p){ return Math.round((p||0)*100)+"%"; }

  function renderShell(){
    const app = $("#app");
    app.replaceChildren(
      h("header",{},
        h("span",{class:"dot",id:"tdot"}),
        h("h1",{},"agentd"),
        h("span",{class:"sp"}),
        h("button",{class:"notiftoggle",onclick:()=>$(".col.notifs").classList.toggle("open")},"Alerts"),
        h("button",{onclick:newSession},"New session"),
        h("button",{onclick:resetActive},"Reset"),
        h("button",{onclick:toggleTheme},"Theme")
      ),
      h("div",{class:"wrap"},
        h("div",{class:"col sessions"}, h("h2",{},"Conversations"), h("div",{class:"scroll",id:"sesslist"})),
        h("div",{class:"col conv-col",
            ondragover:e=>{ e.preventDefault(); },
            ondrop:e=>{ e.preventDefault(); const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) uploadFile(f); }},
          h("div",{class:"conv",id:"conv"}, h("div",{class:"empty"},"Pick or start a session, then type below.")),
          h("div",{class:"composer"},
            h("input",{id:"file",type:"file",style:"display:none",
              onchange:e=>{ const f=e.target.files&&e.target.files[0]; if(f) uploadFile(f); e.target.value=""; }}),
            h("button",{title:"Attach a file (image, audio, document)",onclick:()=>$("#file").click()},"\u{1F4CE}"),
            h("textarea",{id:"input",placeholder:"Message the agent…  (Enter to send, drop a file to attach)",
              onkeydown:e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send(); } }}),
            h("button",{class:"primary",onclick:send},"Send")
          )
        ),
        h("div",{class:"col notifs"}, h("h2",{},"Notifications"), h("div",{class:"scroll",id:"notiflist"},
          h("div",{class:"empty"},"Scheduler and system notifications appear here.")))
      )
    );
    renderSessions(); renderNotifs();
  }

  function toggleTheme(){
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur==="dark" ? "light" : cur==="light" ? "dark" : (matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark");
    document.documentElement.setAttribute("data-theme", next);
  }

  // Compact relative timestamp ("just now", "5m", "2h", "3d", or "Aug 9").
  function fmtWhen(ts){
    if(!ts) return "";
    const d = (typeof ts==="number") ? ts : Date.parse(ts);
    if(!d) return "";
    const s = Math.floor((Date.now()-d)/1000);
    if(s<45) return "just now";
    if(s<90) return "1m ago";
    const m=Math.floor(s/60); if(m<60) return m+"m ago";
    const hr=Math.floor(m/60); if(hr<24) return hr+"h ago";
    const dy=Math.floor(hr/24); if(dy<7) return dy+"d ago";
    return new Date(d).toLocaleDateString(undefined,{month:"short",day:"numeric"});
  }
  // Friendly conversation label from the raw session title.
  function friendlyTitle(t){
    t = t||""; let m;
    if(t.indexOf("continued:")===0) return "Continued from "+t.slice(10,18);
    if((m=/^telegram:(\d+)$/.exec(t))) return "Telegram · "+m[1];
    if(t==="telegram:web") return "Telegram (web)";
    if((m=/^cli:(.+)$/.exec(t))) return "CLI · "+m[1];
    if(t==="web session"||t==="web") return "Web session";
    return t;
  }

  // Group live + past sessions by TITLE into conversation THREADS so the list
  // shows ONE row per conversation, not one row per churned session id. agentd
  // mints a fresh session id on every context-pressure reset / idle reclaim, so
  // a single Telegram thread ("telegram:<chat_id>") can produce dozens of ids;
  // rendered flat that list grows without bound. Here they collapse under their
  // stable title. A thread's addressable id is its LIVE session if it has one
  // (writable), else its most-recent past session (read-only + Continue). The
  // churned ids are hidden by default and reachable via the "N archived" toggle,
  // so no session becomes unreachable.
  function buildThreads(){
    const map = new Map(); const order = [];
    const get = t => { let x=map.get(t); if(!x){ x={title:t,live:null,past:[],lastTs:0,pastLatestTs:0,preview:""}; map.set(t,x); order.push(x); } return x; };
    for(const s of state.sessions){ const t=get(s.title||s.id); t.live=s; t.latestId=s.id; t.lastTs=Date.now()+1; }
    for(const p of state.past){
      const t=get(p.title||p.id); t.past.push(p);
      const ts = p.last_ts? Date.parse(p.last_ts):0;
      if(ts>=t.pastLatestTs){ t.pastLatestTs=ts; t.preview=p.preview||t.preview; if(!t.live){ t.latestId=p.id; } }
      if(!t.live) t.lastTs=Math.max(t.lastTs,ts);
    }
    for(const t of order){ if(t.latestId==null) t.latestId = t.past.length? t.past[0].id : null; t.past.sort((a,b)=>(Date.parse(b.last_ts)||0)-(Date.parse(a.last_ts)||0)); }
    order.sort((a,b)=> b.lastTs - a.lastTs);
    return order;
  }
  function toggleThread(title){ if(state.expanded.has(title)) state.expanded.delete(title); else state.expanded.add(title); renderSessions(); }
  function selectSession(id){ state.active=id; renderSessions(); renderConv(); loadHistory(id); }

  function renderSessions(){
    const list = $("#sesslist"); if(!list) return;
    $("#tdot").className = "dot "+(state.transportOK?"up":"down");
    const threads = buildThreads();
    if(!threads.length){ list.replaceChildren(h("div",{class:"empty"},"No conversations yet. Start one with New session.")); return; }
    const rows = [];
    for(const t of threads){
      const live = t.live;
      const activeHere = t.latestId===state.active || t.past.some(p=>p.id===state.active);
      const turns = live ? (live.turns||0) : t.past.reduce((a,p)=>a+(p.turns||0),0);
      rows.push(h("div",{class:"sess thread"+(activeHere?" active":"")+(live?"":" past"),
          onclick:()=>selectSession(t.latestId)},
        h("div",{class:"trow"},
          h("div",{class:"t"}, esc(friendlyTitle(t.title))),
          h("span",{class:"when"}, live? "live" : fmtWhen(t.pastLatestTs))
        ),
        h("div",{class:"m"},
          live? h("span",{class:"pill "+(live.status||"idle")}, live.status||"idle") : null,
          h("span",{}, turns+(turns===1?" turn":" turns")),
          live? h("span",{}, fmtPct(live.pressure)+" ctx") : null
        ),
        live? h("div",{class:"bar"}, h("i",{style:"width:"+fmtPct(live.pressure)})) : null,
        t.preview? h("div",{class:"pv"}, esc(t.preview)) : null,
        (t.past.length>1 || (!live && t.past.length>=1)) ? h("div",{class:"trow foot"},
          t.past.length>1
            ? h("button",{class:"badge",onclick:e=>{e.stopPropagation();toggleThread(t.title);}},
                (state.expanded.has(t.title)?"▾ ":"▸ ")+t.past.length+" archived")
            : h("span",{class:"badge ghost"}, t.past.length+" archived"),
          (!live) ? h("button",{class:"cbtn",onclick:e=>{e.stopPropagation();continuePast(t.latestId);}},"Continue") : null
        ) : null
      ));
      if(state.expanded.has(t.title)){
        for(const p of t.past){
          rows.push(h("div",{class:"sess sub"+(p.id===state.active?" active":""),
              onclick:()=>selectSession(p.id)},
            h("div",{class:"trow"},
              h("div",{class:"t"}, esc((p.preview||p.id).slice(0,42))),
              h("span",{class:"when"}, fmtWhen(p.last_ts))
            ),
            h("div",{class:"m"},
              h("span",{}, (p.turns||0)+((p.turns||0)===1?" turn":" turns")),
              h("button",{class:"cbtn",onclick:e=>{e.stopPropagation();continuePast(p.id);}},"Continue")
            )
          ));
        }
      }
    }
    list.replaceChildren(...rows);
  }

  // Past sessions: no longer live (idle-GC or daemon restart) but preserved in
  // the run-log. Read-only in the conversation pane (via the history endpoint);
  // "Continue" resumes one as a NEW seeded live session.
  async function loadPast(){
    try{
      const r = await api("/sessions/past");
      state.past = (await r.json())||[];
      state.pastIds = {}; for(const p of state.past) state.pastIds[p.id]=true;
      renderSessions();
    }catch(e){ if(e&&e.unauth) renderLogin(); }
  }
  async function continuePast(id){
    try{
      const r = await api("/sessions/"+encodeURIComponent(id)+"/continue",{method:"POST",body:"{}"});
      const j = await r.json();
      if(j && j.id){ state.active=j.id; await refreshSessions(); await loadPast(); renderConv(); }
    }catch(e){ if(e&&e.unauth) renderLogin(); }
  }

  // Per-session event log kept client-side, keyed by session id.
  const logs = {};
  // History backfill: on page load / session select, replay the prior
  // conversation from GET /sessions/:id/history (the durable run-log; server
  // caps at the last 50 turns). Without this a browser refresh showed
  // "No messages yet." because only live WS events were rendered. Replayed
  // entries are PREPENDED before any live events that raced in during the
  // fetch; fetched once per session per page load.
  const histLoaded = {};
  async function loadHistory(sid){
    if(!sid || histLoaded[sid]) return;
    histLoaded[sid] = true;
    try{
      const r = await api("/sessions/"+encodeURIComponent(sid)+"/history");
      const hist = await r.json();
      const mapped = (hist||[]).map(en => en.role==="user"
        ? {_me:true, text:en.text}
        : {kind:en.kind, text:en.text, tool:en.tool, session_id:sid, ts:en.ts});
      logs[sid] = mapped.concat(logs[sid]||[]);
      if(sid===state.active) renderConv();
    }catch(e){ histLoaded[sid] = false; if(e&&e.unauth) renderLogin(); }
  }
  function pushEv(ev){
    const sid = ev.session_id||"";
    (logs[sid] = logs[sid]||[]).push(ev);
    if(logs[sid].length>400) logs[sid].shift();
    if(sid===state.active) renderConv();
  }
  function pushLocal(sid, ev){ (logs[sid]=logs[sid]||[]).push(ev); if(sid===state.active) renderConv(); }

  function renderConv(){
    const conv = $("#conv"); if(!conv) return;
    const evs = logs[state.active]||[];
    if(!evs.length){ conv.replaceChildren(h("div",{class:"empty"}, state.active?"No messages yet.":"Pick or start a session.")); return; }
    conv.replaceChildren(...evs.map(renderEv).filter(Boolean));
    conv.scrollTop = conv.scrollHeight;
  }

  function renderEv(ev){
    if(ev._me) return h("div",{class:"ev me"}, h("pre",{}, esc(ev.text)));
    const kind = ev.kind||"output";
    if(kind==="tool_call") return h("div",{class:"ev"}, h("div",{class:"k"},"tool"), h("span",{class:"tool"}, esc(ev.tool||ev.text||"")));
    if(kind==="needs_input"){
      const tok = ev.session_id||"";
      return h("div",{class:"confirm"},
        h("span",{}, esc(ev.text||"Confirm this action?")),
        h("button",{class:"primary",onclick:()=>confirmDecision(tok,true)},"Approve"),
        h("button",{onclick:()=>confirmDecision(tok,false)},"Deny")
      );
    }
    // A result event whose text was already streamed as the turn's final output
    // arrives text-less (turn-terminal marker only): render nothing, the reply
    // is already on screen as the output card.
    if(kind==="result" && !ev.text) return null;
    const cls = kind==="result"?"ev result":kind==="error"?"ev error":"ev";
    // Agent output/result render as markdown; errors stay verbatim. Safe:
    // mdRender HTML-escapes the whole text before any transform, so this is
    // never innerHTML of raw model text. History-replayed entries flow through
    // this same function, so refreshed pages render identically to live ones.
    if(kind==="error") return h("div",{class:cls}, h("div",{class:"k"}, kind), h("pre",{}, esc(ev.text)));
    const md = h("div",{class:"md"});
    md.innerHTML = mdRender(ev.text);
    return h("div",{class:cls}, h("div",{class:"k"}, kind), md);
  }

  function renderNotifs(){
    const list = $("#notiflist"); if(!list) return;
    if(!state.notifs.length){ list.replaceChildren(h("div",{class:"empty"},"No notifications yet.")); return; }
    list.replaceChildren(...state.notifs.map(n=>
      h("div",{class:"notif "+(n.level||"info")},
        h("div",{class:"s"}, h("span",{}, esc(n.source)), h("span",{}, new Date(n.ts).toLocaleTimeString())),
        h("div",{class:"x"}, esc(n.text))
      )
    ));
  }

  async function refreshSessions(){
    try{
      const r = await api("/sessions"); state.sessions = await r.json();
      if(!state.active && state.sessions.length) state.active = state.sessions[0].id;
      if(state.active) loadHistory(state.active);
      const hr = await (await api("/health")).json().catch(()=>({}));
      if(hr && "transport_ok" in hr) state.transportOK = hr.transport_ok;
      renderSessions();
    }catch(e){ if(e&&e.unauth){ renderLogin(); return; } }
  }

  async function newSession(){
    try{ const r=await api("/sessions",{method:"POST",body:JSON.stringify({title:"web session"})});
      const j=await r.json(); state.active=j.id; await refreshSessions(); renderConv();
    }catch(e){ if(e&&e.unauth) renderLogin(); }
  }
  async function resetActive(){
    if(!state.active) return;
    try{ await api("/sessions/"+state.active+"/reset",{method:"POST",body:JSON.stringify({reason:"explicit (web ui)"})}); }
    catch(e){ if(e&&e.unauth) renderLogin(); }
  }
  async function confirmDecision(token, approve){
    try{ await api("/confirm/"+encodeURIComponent(token),{method:"POST",body:JSON.stringify({approve})}); }
    catch(e){ if(e&&e.unauth) renderLogin(); }
  }

  function send(){
    const ta = $("#input"); const text = ta.value.trim(); if(!text) return;
    if(state.active && state.pastIds[state.active]){
      state.notifs.unshift({source:"web", level:"info", ts:new Date().toISOString(),
        text:"Past session is read-only. Use Continue to resume it as a new session."});
      renderNotifs(); return;
    }
    ta.value="";
    // Echo my message locally under the active (or soon-to-be web) session.
    pushLocal(state.active||"", {_me:true,text});
    // A selected LIVE session gets the turn directly (so continued sessions are
    // addressable); with nothing selected, the WS input path lazily creates the
    // warm web session via RouteInbound as before.
    const live = state.sessions.some(s=>s.id===state.active);
    if(live){
      api("/sessions/"+encodeURIComponent(state.active)+"/input",{method:"POST",body:JSON.stringify({text})})
        .catch(e=>{ if(e&&e.unauth) renderLogin(); });
    } else if(state.ws && state.ws.readyState===1){ state.ws.send(JSON.stringify({type:"input",text})); }
  }

  // Media upload: POST the file (multipart, with the composer text if any) to
  // /sessions/:id/media on the LIVE active session, creating one first if
  // needed. The server ingests via the core media service and routes the
  // artifact as an ordinary turn; the reply streams back over the WS.
  async function uploadFile(f){
    try{
      let sid = state.active;
      const live = state.sessions.some(s=>s.id===sid);
      if(!live){
        const r = await api("/sessions",{method:"POST",body:JSON.stringify({title:"web session"})});
        const j = await r.json(); sid = j.id; state.active = sid; await refreshSessions();
      }
      const ta = $("#input"); const text = ta.value.trim(); ta.value = "";
      pushLocal(sid, {_me:true, text:(text? text+"\n":"")+"\u{1F4CE} "+f.name+" ("+Math.round(f.size/1024)+" KB)"});
      const fd = new FormData();
      fd.append("file", f, f.name);
      if(text) fd.append("text", text);
      const resp = await fetch("/sessions/"+encodeURIComponent(sid)+"/media",{
        method:"POST", body:fd, credentials:"same-origin"});
      if(resp.status===401){ renderLogin(); return; }
      if(!resp.ok){
        const msg = (await resp.text()).slice(0,300);
        state.notifs.unshift({source:"media", level:"issue", ts:new Date().toISOString(),
          text:"Upload of "+f.name+" failed ("+resp.status+"): "+msg});
        renderNotifs();
      }
    }catch(e){
      state.notifs.unshift({source:"media", level:"issue", ts:new Date().toISOString(),
        text:"Upload of "+f.name+" failed: "+e});
      renderNotifs();
    }
  }

  function connectWS(){
    const proto = location.protocol==="https:"?"wss:":"ws:";
    const ws = new WebSocket(proto+"//"+location.host+"/ws");
    state.ws = ws;
    ws.onmessage = ev=>{
      let m; try{ m=JSON.parse(ev.data); }catch(_){ return; }
      if(m.type==="event"){ pushEv(m.event); if(m.event && !state.active) { state.active=m.event.session_id; renderSessions(); loadHistory(state.active); } refreshSessions(); }
      else if(m.type==="notification"){ state.notifs.unshift(m.notification); if(state.notifs.length>100)state.notifs.pop(); renderNotifs(); }
      else if(m.type==="reply"){ /* result already arrives as an event; reply is a fallback */ }
    };
    ws.onclose = ()=>{ setTimeout(connectWS, 1500); };
    ws.onerror = ()=>{ try{ws.close();}catch(_){}} ;
  }

  async function boot(){
    try{ await api("/health"); }catch(e){ if(e&&e.unauth){ renderLogin(); return; } }
    renderShell();
    await refreshSessions();
    loadPast();
    connectWS();
    setInterval(refreshSessions, 5000);
    setInterval(loadPast, 30000); // past list changes rarely (GC/restart); cheap poll
  }
  boot();
})();
</script>
</body>
</html>
