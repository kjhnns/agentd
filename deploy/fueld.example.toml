# fueld config (docs/specs/2026-10-fuel-api.md section 15).
# Default path ~/.config/fueld/config.toml; must be mode 0600 (fueld refuses
# a file readable by group or others). Flat keys, no sections.
# Values: "env:VAR" reads the environment, anything else is a literal.

listen         = "100.120.65.8:8796"           # tailnet address; the HTTPS proxy forwards here
token          = "env:FUEL_TOKEN"              # pass agentd/fuel-token
variables_url  = "https://app.logvariables.com/api/ext"
variables_key  = "env:VARIABLES_KEY"           # pass variables/api-key
food_log_var   = "Food log"                    # json variable NAMES, resolved at startup
body_var       = "Body composition"
model_provider = "openai"
model          = "gpt-5.1"
model_key      = "env:OPENAI_API_KEY"          # pass openai/api-key (also used for Whisper)
# model_effort = ""                            # optional reasoning_effort
# model_chat  = ""                            # optional: a second model for non-log turns (correct, undo, move, question)
# model_chat_effort = ""
log_budget     = "90s"                         # a whole POST /fuel/log (quality over speed, spec 17)
model_timeout  = "60s"                         # one model call
whisper_model  = "whisper-1"
targets_file   = "~/.agentd/fuel-targets.json" # missing = built-in defaults
staples_file   = "~/.agentd/fuel-staples.json" # shared with ~/clawd/scripts/food-log
state_dir      = "~/.local/state/fueld"
strava_dir     = "~/warehouse/raw-sources/strava"
test_mode      = false                         # true refuses food_log_var "Food log"

# Second-opinion recalibration of photo meals (spec section 16). fueld is a
# plain client of an agentd API (a fresh session per job, photos uploaded as
# media turns). Default off.
recalibrate_enabled      = false
recalibrate_agentd_url   = "http://127.0.0.1:8798"   # the sandboxed agentd-safe instance
recalibrate_agentd_token = "env:FUEL_AGENTD_TOKEN"   # pass agentd-safe/web-token
recalibrate_timeout      = "10m"                     # one job
recalibrate_min_interval = "30s"                     # between job starts
# recalibrate_kill_file  = "~/.local/state/fueld/recalibrate.off"  # touch it to stop new jobs

# The web app (spec section 23). Default off: no static route, no session
# route, cookies ignored. public_origin is the ONE origin the page runs on.
# web_enabled   = true
# public_origin = "https://fuel.gojoe.run"
# web_insecure_test_cookie = true   # test instances on plain http only; refused with https or without test_mode
